<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>执行日志 - ETL通用数据抽取平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .filter-bar select,
        .filter-bar input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
            background: var(--input-bg);
            color: var(--text-primary);
        }
        .filter-bar select { min-width: 150px; }
        .filter-bar input { min-width: 200px; }
        .filter-bar .btn { padding: 8px 16px; }
        .log-detail-row { background: var(--table-header-bg); }
        .log-detail-content {
            padding: 15px 20px;
            font-size: 13px;
            line-height: 1.6;
        }
        .log-detail-content .detail-item {
            display: flex;
            margin-bottom: 8px;
        }
        .log-detail-content .detail-label {
            width: 120px;
            color: var(--text-secondary);
            flex-shrink: 0;
            font-weight: 600;
        }
        .log-detail-content .detail-value { flex: 1; color: var(--text-primary); }
        .log-detail-content .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px;
            border-radius: var(--radius-sm);
            margin-top: 10px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'SF Mono', 'Cascadia Code', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-database"></i> <span>ETL平台</span></h1>
            </div>
            <ul class="sidebar-menu">
                <li onclick="location.href='index.html'"><i class="fas fa-tachometer-alt"></i> <span>仪表盘</span></li>
                <li onclick="location.href='datasource.html'"><i class="fas fa-plug"></i> <span>数据源管理</span></li>
                <li onclick="location.href='task.html'"><i class="fas fa-tasks"></i> <span>任务管理</span></li>
                <li onclick="location.href='mapping.html'"><i class="fas fa-exchange-alt"></i> <span>字段映射</span></li>
                <li class="active" onclick="location.href='log.html'"><i class="fas fa-chart-line"></i> <span>执行日志</span></li>
            </ul>
            <div class="sidebar-footer">ETL Platform v1.0.0</div>
        </aside>

        <div class="main-content">
            <div class="top-bar">
                <h2><i class="fas fa-chart-line"></i> 执行日志</h2>
                <div class="top-bar-actions">
                    <button class="theme-toggle" id="themeToggleBtn" title="切换主题"><i class="fas fa-moon"></i></button>
                    <button class="btn btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> 退出</button>
                    <button class="btn btn-secondary" onclick="refreshLogs()" title="刷新"><i class="fas fa-sync"></i> 刷新</button>
                </div>
            </div>

            <div class="content-area">
                <div class="filter-bar">
                    <select id="taskFilter" onchange="filterLogs()">
                        <option value="">所有任务</option>
                    </select>
                    <select id="statusFilter" onchange="filterLogs()">
                        <option value="">所有状态</option>
                        <option value="RUNNING">运行中</option>
                        <option value="SUCCESS">成功</option>
                        <option value="FAILED">失败</option>
                    </select>
                    <input type="text" id="searchInput" placeholder="搜索任务编码或名称..." onkeyup="filterLogs()">
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>执行ID</th>
                                        <th>任务编码</th>
                                        <th>任务名称</th>
                                        <th>状态</th>
                                        <th>触发类型</th>
                                        <th>开始时间</th>
                                        <th>耗时</th>
                                        <th>影响行数</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="logTable">
                                    <tr><td colspan="9" style="text-align:center;color:#999;">加载中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Login gate
        (function() {
            var token = localStorage.getItem('etl-login-token');
            if (!token) { window.location.href = 'login.html'; return; }
            try {
                var t = JSON.parse(token);
                if (Date.now() - t.time > 8 * 60 * 60 * 1000) {
                    localStorage.removeItem('etl-login-token');
                    window.location.href = 'login.html';
                    return;
                }
            } catch(e) { window.location.href = 'login.html'; return; }
            window.logout = function() {
                localStorage.removeItem('etl-login-token');
                window.location.href = 'login.html';
            };
        })();</script>
    <script src="js/utils.js"></script>
    <script>
        let allLogs = [];
        let tasks = [];

        document.addEventListener('DOMContentLoaded', async function() {
            await loadTasks();
            await loadLogs();
        });

        async function loadTasks() {
            try {
                const res = await TaskAPI.list();
                if (res.success && res.data) {
                    tasks = res.data;
                    const select = document.getElementById('taskFilter');
                    select.innerHTML = '<option value="">所有任务</option>' +
                        tasks.map(t => `<option value="${t.taskCode}">${t.taskCode} - ${t.taskName}</option>`).join('');
                }
            } catch (e) {
                console.error('加载任务失败', e);
            }
        }

        async function loadLogs() {
            showLoading();
            try {
                const taskList = tasks;
                allLogs = [];
                if (taskList.length > 0) {
                    for (const task of taskList) {
                        try {
                            const res = await MonitorAPI.getLogs(task.taskCode);
                            if (res.success && res.data) {
                                allLogs = allLogs.concat(res.data);
                            }
                        } catch (e) {
                            // Ignore errors for individual tasks
                        }
                    }
                }
                allLogs.sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
                renderLogs(allLogs);
            } catch (e) {
                showToast('加载日志失败: ' + e.message, 'error');
            } finally {
                hideLoading();
            }
        }

        function renderLogs(data) {
            const tbody = document.getElementById('logTable');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;">暂无执行日志</td></tr>';
                return;
            }
            tbody.innerHTML = data.map((log, index) => {
                const statusClass = log.status === 'SUCCESS' ? 'tag-success' : log.status === 'FAILED' ? 'tag-error' : 'tag-info';
                const duration = log.executionDuration ? log.executionDuration + 's' : (log.endTime ? calcDuration(log.startTime, log.endTime) : '-');
                const statusIcon = log.status === 'RUNNING' ? '<i class="fas fa-spinner fa-spin"></i>' :
                    log.status === 'SUCCESS' ? '<i class="fas fa-check-circle"></i>' :
                    log.status === 'FAILED' ? '<i class="fas fa-times-circle"></i>' : '';
                return `<tr>
                    <td>${log.executionId || '-'}</td>
                    <td><strong>${log.taskCode}</strong></td>
                    <td>${log.taskName || '-'}</td>
                    <td><span class="tag ${statusClass}">${statusIcon} ${log.status}</span></td>
                    <td><span class="tag tag-default">${log.triggerType || '-'}</span></td>
                    <td>${formatDate(log.startTime)}</td>
                    <td>${duration}</td>
                    <td>${log.totalRows || 0}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="toggleDetail(${index})" title="详情"><i class="fas fa-eye"></i></button>
                    </td>
                </tr>
                <tr class="log-detail-row" id="detail-${index}" style="display:none;">
                    <td colspan="9">
                        <div class="log-detail-content">
                            <div class="detail-item">
                                <span class="detail-label">执行ID:</span>
                                <span class="detail-value">${log.executionId || '-'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">任务编码:</span>
                                <span class="detail-value">${log.taskCode}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">任务名称:</span>
                                <span class="detail-value">${log.taskName || '-'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">状态:</span>
                                <span class="detail-value">${log.status}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">触发类型:</span>
                                <span class="detail-value">${log.triggerType || '-'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">触发用户:</span>
                                <span class="detail-value">${log.triggerUser || '-'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">开始时间:</span>
                                <span class="detail-value">${formatDate(log.startTime)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">结束时间:</span>
                                <span class="detail-value">${formatDate(log.endTime)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">耗时:</span>
                                <span class="detail-value">${log.executionDuration ? log.executionDuration + 's' : '-'}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">总行数:</span>
                                <span class="detail-value">${log.totalRows || 0}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">成功行数:</span>
                                <span class="detail-value">${log.successRows || 0}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">失败行数:</span>
                                <span class="detail-value">${log.failedRows || 0}</span>
                            </div>
                            ${log.errorMessage ? `<div class="detail-item">
                                <span class="detail-label">错误信息:</span>
                            </div>
                            <div class="error-message">${log.errorMessage}</div>` : ''}
                        </div>
                    </td>
                </tr>`;
            }).join('');
        }

        function toggleDetail(index) {
            const row = document.getElementById(`detail-${index}`);
            if (row.style.display === 'none') {
                row.style.display = 'table-row';
            } else {
                row.style.display = 'none';
            }
        }

        function calcDuration(start, end) {
            if (!start || !end) return '-';
            const diff = new Date(end) - new Date(start);
            return Math.round(diff / 1000) + 's';
        }

        function filterLogs() {
            const taskFilter = document.getElementById('taskFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            const searchInput = document.getElementById('searchInput').value.toLowerCase();

            let filtered = allLogs;

            if (taskFilter) {
                filtered = filtered.filter(l => l.taskCode === taskFilter);
            }
            if (statusFilter) {
                filtered = filtered.filter(l => l.status === statusFilter);
            }
            if (searchInput) {
                filtered = filtered.filter(l =>
                    (l.taskCode && l.taskCode.toLowerCase().includes(searchInput)) ||
                    (l.taskName && l.taskName.toLowerCase().includes(searchInput))
                );
            }

            renderLogs(filtered);
        }

        async function refreshLogs() {
            await loadLogs();
        }
    </script>
</body>
</html>
