<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>字段映射 - ETL通用数据抽取平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .task-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .task-selector select {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-database"></i> <span>ETL平台</span></h1>
            </div>
            <ul class="sidebar-menu">
                <li onclick="location.href='index.html'"><i class="fas fa-tachometer-alt"></i> <span>仪表盘</span></li>
                <li onclick="location.href='datasource.html'"><i class="fas fa-plug"></i> <span>数据源管理</span></li>
                <li onclick="location.href='task.html'"><i class="fas fa-tasks"></i> <span>任务管理</span></li>
                <li class="active" onclick="location.href='mapping.html'"><i class="fas fa-exchange-alt"></i> <span>字段映射</span></li>
                <li onclick="location.href='log.html'"><i class="fas fa-chart-line"></i> <span>执行日志</span></li>
            </ul>
            <div class="sidebar-footer">ETL Platform v1.0.0</div>
        </aside>

        <div class="main-content">
            <div class="top-bar">
                <h2><i class="fas fa-exchange-alt"></i> 字段映射</h2>
                <div class="top-bar-actions">
                    <button class="btn btn-primary" onclick="openModal()" id="addBtn" disabled><i class="fas fa-plus"></i> 新增映射</button>
                </div>
            </div>

            <div class="content-area">
                <div class="task-selector">
                    <select id="taskSelect" onchange="changeTask()">
                        <option value="">选择任务...</option>
                    </select>
                </div>

                <div class="card">
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>序号</th>
                                        <th>源字段</th>
                                        <th>目标字段</th>
                                        <th>数据类型</th>
                                        <th>转换表达式</th>
                                        <th>默认值</th>
                                        <th>主键</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="mappingTable">
                                    <tr><td colspan="9" style="text-align:center;color:#999;">请先选择任务</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="mappingModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">新增字段映射</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form id="mappingForm">
                    <input type="hidden" name="id" id="mappingId">
                    <div class="form-row">
                        <div class="form-group full-width">
                            <label>任务编码</label>
                            <input type="text" name="taskCode" id="taskCode" readonly required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>源字段</label>
                            <input type="text" name="sourceColumn" id="sourceColumn" required>
                        </div>
                        <div class="form-group">
                            <label>目标字段</label>
                            <input type="text" name="targetColumn" id="targetColumn" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>数据类型</label>
                            <select name="dataType" id="dataType">
                                <option value="">--</option>
                                <option value="STRING">STRING</option>
                                <option value="INTEGER">INTEGER</option>
                                <option value="LONG">LONG</option>
                                <option value="DOUBLE">DOUBLE</option>
                                <option value="DECIMAL">DECIMAL</option>
                                <option value="DATE">DATE</option>
                                <option value="DATETIME">DATETIME</option>
                                <option value="BOOLEAN">BOOLEAN</option>
                                <option value="CLOB">CLOB</option>
                                <option value="BLOB">BLOB</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>默认值</label>
                            <input type="text" name="defaultValue" id="defaultValue">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>转换表达式</label>
                            <input type="text" name="transformExpr" id="transformExpr" placeholder="如: UPPER(#sourceColumn)">
                        </div>
                        <div class="form-group">
                            <label>映射顺序</label>
                            <input type="number" name="mappingOrder" id="mappingOrder" value="0">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>是否主键</label>
                            <select name="isPrimaryKey" id="isPrimaryKey">
                                <option value="N">否</option>
                                <option value="Y">是</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>状态</label>
                            <select name="enabled" id="enabled">
                                <option value="Y">启用</option>
                                <option value="N">禁用</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group full-width">
                            <label>描述</label>
                            <textarea name="description" id="description" rows="2"></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveMapping()">保存</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        let currentTaskCode = null;
        let editingId = null;

        document.addEventListener('DOMContentLoaded', async function() {
            await loadTasks();
        });

        async function loadTasks() {
            try {
                const res = await TaskAPI.list();
                if (res.success && res.data) {
                    const select = document.getElementById('taskSelect');
                    select.innerHTML = '<option value="">选择任务...</option>' +
                        res.data.map(t => `<option value="${t.taskCode}">${t.taskCode} - ${t.taskName}</option>`).join('');
                }
            } catch (e) {
                console.error('加载任务失败', e);
            }
        }

        function changeTask() {
            const select = document.getElementById('taskSelect');
            currentTaskCode = select.value;
            document.getElementById('addBtn').disabled = !currentTaskCode;
            if (currentTaskCode) {
                loadMappings(currentTaskCode);
            } else {
                document.getElementById('mappingTable').innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;">请先选择任务</td></tr>';
            }
        }

        async function loadMappings(taskCode) {
            showLoading();
            try {
                const res = await MappingAPI.list(taskCode);
                if (res.success) {
                    renderTable(res.data);
                }
            } catch (e) {
                showToast('加载失败: ' + e.message, 'error');
            } finally {
                hideLoading();
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('mappingTable');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:#999;">暂无字段映射</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(m => {
                const statusClass = m.enabled === 'Y' ? 'tag-success' : 'tag-default';
                const pkBadge = m.isPrimaryKey === 'Y' ? '<span class="tag tag-warning">PK</span>' : '';
                return `<tr>
                    <td>${m.mappingOrder || 0}</td>
                    <td><strong>${m.sourceColumn}</strong></td>
                    <td><strong>${m.targetColumn}</strong></td>
                    <td><span class="tag tag-info">${m.dataType || '-'}</span></td>
                    <td>${m.transformExpr || '-'}</td>
                    <td>${m.defaultValue || '-'}</td>
                    <td>${pkBadge}</td>
                    <td><span class="tag ${statusClass}">${m.enabled === 'Y' ? '启用' : '禁用'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-secondary" onclick="editMapping(${m.id})" title="编辑"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm btn-danger" onclick="deleteMapping(${m.id})" title="删除"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        function openModal() {
            if (!currentTaskCode) {
                showToast('请先选择任务', 'warning');
                return;
            }
            editingId = null;
            document.getElementById('modalTitle').textContent = '新增字段映射';
            document.getElementById('mappingForm').reset();
            document.getElementById('mappingId').value = '';
            document.getElementById('taskCode').value = currentTaskCode;
            toggleModal('mappingModal', true);
        }

        function closeModal() {
            toggleModal('mappingModal', false);
        }

        async function saveMapping() {
            const data = getFormData('mappingForm');
            if (editingId) data.id = editingId;
            showLoading();
            try {
                const res = await MappingAPI.save(data);
                if (res.success) {
                    showToast('保存成功', 'success');
                    closeModal();
                    await loadMappings(currentTaskCode);
                }
            } catch (e) {
                showToast('保存失败: ' + e.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function editMapping(id) {
            showLoading();
            try {
                const res = await MappingAPI.get(id);
                if (res.success && res.data) {
                    setFormData('mappingForm', res.data);
                    editingId = id;
                    document.getElementById('modalTitle').textContent = '编辑字段映射';
                    toggleModal('mappingModal', true);
                }
            } catch (e) {
                showToast('获取详情失败: ' + e.message, 'error');
            } finally {
                hideLoading();
            }
        }

        async function deleteMapping(id) {
            if (!confirmDialog('确定要删除该字段映射吗？')) return;
            showLoading();
            try {
                const res = await MappingAPI.delete(id);
                if (res.success) {
                    showToast('删除成功', 'success');
                    await loadMappings(currentTaskCode);
                }
            } catch (e) {
                showToast('删除失败: ' + e.message, 'error');
            } finally {
                hideLoading();
            }
        }
    </script>
</body>
</html>
