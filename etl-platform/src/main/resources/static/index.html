<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - ETL通用数据抽取平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-database"></i> <span>ETL平台</span></h1>
            </div>
            <ul class="sidebar-menu">
                <li class="active" onclick="location.href='index.html'"><i class="fas fa-tachometer-alt"></i> <span>仪表盘</span></li>
                <li onclick="location.href='datasource.html'"><i class="fas fa-plug"></i> <span>数据源管理</span></li>
                <li onclick="location.href='task.html'"><i class="fas fa-tasks"></i> <span>任务管理</span></li>
                <li onclick="location.href='mapping.html'"><i class="fas fa-exchange-alt"></i> <span>字段映射</span></li>
                <li onclick="location.href='log.html'"><i class="fas fa-chart-line"></i> <span>执行日志</span></li>
            </ul>
            <div class="sidebar-footer">ETL Platform v1.0.0</div>
        </aside>

        <div class="main-content">
            <div class="top-bar">
                <h2><i class="fas fa-tachometer-alt"></i> 仪表盘</h2>
                <div class="top-bar-actions">
                    <button class="btn btn-secondary" onclick="location.reload()"><i class="fas fa-sync"></i> 刷新</button>
                </div>
            </div>

            <div class="content-area">
                <div class="stats-grid">
                    <div class="stat-card blue">
                        <div class="stat-icon"><i class="fas fa-tasks"></i></div>
                        <div class="stat-info">
                            <h4 id="totalTasks">-</h4>
                            <p>总任务数</p>
                        </div>
                    </div>
                    <div class="stat-card green">
                        <div class="stat-icon"><i class="fas fa-play-circle"></i></div>
                        <div class="stat-info">
                            <h4 id="runningTasks">-</h4>
                            <p>运行中</p>
                        </div>
                    </div>
                    <div class="stat-card orange">
                        <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                        <div class="stat-info">
                            <h4 id="successTasks">-</h4>
                            <p>成功任务</p>
                        </div>
                    </div>
                    <div class="stat-card red">
                        <div class="stat-icon"><i class="fas fa-times-circle"></i></div>
                        <div class="stat-info">
                            <h4 id="failedTasks">-</h4>
                            <p>失败任务</p>
                        </div>
                    </div>
                    <div class="stat-card purple">
                        <div class="stat-icon"><i class="fas fa-plug"></i></div>
                        <div class="stat-info">
                            <h4 id="totalDatasources">-</h4>
                            <p>数据源</p>
                        </div>
                    </div>
                    <div class="stat-card cyan">
                        <div class="stat-icon"><i class="fas fa-clock"></i></div>
                        <div class="stat-info">
                            <h4 id="scheduledTasks">-</h4>
                            <p>定时任务</p>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-history"></i> 最近执行记录</h3>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>任务编码</th>
                                        <th>任务名称</th>
                                        <th>状态</th>
                                        <th>开始时间</th>
                                        <th>耗时</th>
                                        <th>影响行数</th>
                                    </tr>
                                </thead>
                                <tbody id="recentLogs">
                                    <tr><td colspan="6" style="text-align:center;color:#999;">暂无数据</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3><i class="fas fa-bolt"></i> 快捷操作</h3>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary" onclick="location.href='datasource.html'">新增数据源</button>
                        <button class="btn btn-primary" onclick="location.href='task.html'" style="margin-left:10px;">新增任务</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            await loadDashboardData();
        });

        async function loadDashboardData() {
            try {
                const tasks = await TaskAPI.list();
                if (tasks.success) {
                    const taskList = tasks.data || [];
                    document.getElementById('totalTasks').textContent = taskList.length;
                    document.getElementById('scheduledTasks').textContent = taskList.filter(t => t.cronExpr).length;
                }

                const datasources = await DataSourceAPI.list();
                if (datasources.success) {
                    document.getElementById('totalDatasources').textContent = datasources.data.length;
                }

                const taskList = tasks.data || [];
                if (taskList.length > 0) {
                    const logs = await MonitorAPI.getLogs(taskList[0].taskCode);
                    if (logs.success && logs.data) {
                        renderRecentLogs(logs.data);
                    }
                }

            } catch (e) {
                console.error('加载仪表盘数据失败', e);
            }
        }

        function renderRecentLogs(logs) {
            const tbody = document.getElementById('recentLogs');
            if (!logs || logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;">暂无执行记录</td></tr>';
                return;
            }
            tbody.innerHTML = logs.slice(0, 10).map(log => {
                const statusClass = log.status === 'SUCCESS' ? 'tag-success' : log.status === 'FAILED' ? 'tag-error' : log.status === 'RUNNING' ? 'tag-info' : 'tag-default';
                return `<tr>
                    <td>${log.taskCode}</td>
                    <td>${log.taskName || '-'}</td>
                    <td><span class="tag ${statusClass}">${log.status}</span></td>
                    <td>${formatDate(log.startTime)}</td>
                    <td>${log.executionDuration ? log.executionDuration + 's' : '-'}</td>
                    <td>${log.totalRows || 0}</td>
                </tr>`;
            }).join('');
        }
    </script>
</body>
</html>
