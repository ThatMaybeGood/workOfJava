<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - ETL通用数据抽取平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

    <div class="login-bg">
        <div class="login-bg-gradient"></div>
        <canvas id="particleCanvas"></canvas>
    </div>

    <div class="login-wrapper">
        <div class="login-card" id="loginCard">
            <div class="login-logo">
                <i class="fas fa-database"></i>
            </div>
            <h1>ETL数据抽取平台</h1>
            <p class="login-subtitle">Enterprise Data Integration</p>

            <!-- Login form -->
            <form class="login-form" id="loginForm">
                <div class="login-input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="用户名" autocomplete="username" required>
                </div>
                <div class="login-input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="密码" autocomplete="current-password" required>
                </div>
                <div class="login-options">
                    <label class="login-remember">
                        <input type="checkbox" id="rememberMe"> 记住我
                    </label>
                </div>
                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> 登 录
                </button>
            </form>
            <p class="login-error" id="loginError"></p>
        </div>
        <p class="login-footer">ETL Platform v1.0.0</p>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
