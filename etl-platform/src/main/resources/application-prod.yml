spring:
  config:
    activate:
      on-profile: prod

  # 生产环境元数据库配置（通过环境变量传入）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      test-on-borrow: true
      test-while-idle: true
      validation-query: SELECT 1 FROM DUAL
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_USER:admin}
        login-password: ${DRUID_PASS:admin123}
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

# 生产环境日志
logging:
  level:
    root: info
    com.etl: info
    com.baomidou.mybatisplus: warn
    org.apache.ibatis.executor: warn
  file:
    name: logs/etl-platform-prod.log

# Swagger (生产环境建议关闭)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
