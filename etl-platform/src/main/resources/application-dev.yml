spring:
  config:
    activate:
      on-profile: dev

  # 开发环境使用H2内存数据库作为元数据库（零依赖启动）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:etl_platform;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=RUNSCRIPT FROM 'classpath:db/h2_init.sql'
    username: sa
    password:
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-on-borrow: true
      test-while-idle: true
      validation-query: SELECT 1
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  # H2 Console (开发调试使用)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# 开发环境日志
logging:
  level:
    root: info
    com.etl: debug
    com.baomidou.mybatisplus: debug
  file:
    name: logs/etl-platform-dev.log

# Swagger
springdoc:
  api-docs:
    groups:
      enabled: true
  swagger-ui:
    default-model-expand-depth: -1
    display-request-duration: true
    default-models-expand-depth: -1
    tags-sorter: alpha
    operations-sorter: alpha
