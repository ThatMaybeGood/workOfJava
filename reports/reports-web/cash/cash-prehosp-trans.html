<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>院前转住院统计</title>
    <link href="../vendor/bootstrap@5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../vendor/flatpickr@4.6.13/css/flatpickr.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/month-range-picker.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-2">
        <div class="page-title d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <span class="title-bar"></span>
                院前转住院统计
            </div>
            <label class="mock-toggle mb-0">
                <span class="mock-label">Mock数据</span>
                <input type="checkbox" id="mockToggle" checked>
                <span class="mock-status" id="mockStatus">Mock</span>
            </label>
        </div>

        <div class="filter-section">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">统计时间：</span>
                    <div class="filter-buttons" id="timeDimensionFilter">
                        <button class="filter-btn" data-value="month">按月统计</button>
                        <button class="filter-btn active" data-value="day">按天统计</button>
                    </div>
                    <div class="date-range-picker">
                        <div class="date-input-wrapper range-wrapper" id="dayRangeWrapper">
                            <input type="text" class="form-control form-control-sm date-input" id="dateRange" readonly>
                            <i class="bi bi-calendar date-input-icon"></i>
                        </div>
                        <span id="monthRangePicker" style="display:none;"></span>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">操作员：</span>
                    <select class="form-select form-select-sm" id="operatorFilter" style="width:180px">
                        <option value="">全部</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header d-flex justify-content-between align-items-center">
                <div class="table-title"><i class="bi bi-hospital"></i><span id="tableTitle">院前转住院统计</span></div>
                <div class="d-flex align-items-center gap-2">
                    <button class="btn btn-outline-secondary btn-sm" id="maintBtn"><i class="bi bi-person-gear me-1"></i>操作员维护</button>
                    <button class="btn btn-primary btn-sm" id="exportBtn"><i class="bi bi-download me-1"></i>导出Excel</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-bordered mb-0" id="preHospTable">
                    <thead class="table-light" id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div id="tableEmpty" class="text-center text-muted py-4 d-none">暂无数据</div>
            <div class="pagination-wrapper d-flex justify-content-center align-items-center mt-3 gap-3">
                <div class="pagination-info"><span id="pageInfo">10条/页 共0条</span></div>
                <nav aria-label="Page navigation"><ul class="pagination mb-0" id="pagination"></ul></nav>
                <div class="pagination-controls d-flex align-items-center gap-1">
                    <select class="form-select form-select-sm" id="pageSizeSelect">
                        <option value="10" selected>10条/页</option>
                        <option value="20">20条/页</option>
                        <option value="50">50条/页</option>
                    </select>
                    <span>跳至</span>
                    <input type="number" class="form-control form-control-sm page-jump-input" id="jumpPage" min="1">
                    <span>页</span>
                    <button class="btn btn-sm btn-outline-secondary" id="jumpBtn">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 操作员维护弹窗：关键字筛选 + 新增行(行内编辑保存) + 有效开关/删除 -->
    <div class="modal fade" id="maintModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">院前操作员维护</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex align-items-center gap-2 mb-2">
                        <input type="text" class="form-control form-control-sm" id="maintKeyword" style="max-width:260px"
                               placeholder="输入姓名关键字筛选">
                        <button class="btn btn-primary btn-sm" id="addNewBtn"><i class="bi bi-plus-lg me-1"></i>新增</button>
                    </div>
                    <div class="table-responsive" style="max-height:55vh">
                        <table class="table table-hover table-bordered mb-0">
                            <thead class="table-light">
                                <tr><th>姓名</th><th>登录ID</th><th>是否有效</th><th>操作</th></tr>
                            </thead>
                            <tbody id="maintTableBody"></tbody>
                        </table>
                    </div>
                    <div id="maintEmpty" class="text-center text-muted py-2 d-none">暂无符合条件的操作员</div>
                    <div class="pagination-wrapper d-flex justify-content-center align-items-center mt-3 gap-3" id="maintPagerWrap">
                        <div class="pagination-info"><span id="maintPageInfo">10条/页 共0条</span></div>
                        <nav aria-label="Maint page navigation"><ul class="pagination pagination-sm mb-0" id="maintPagination"></ul></nav>
                        <div class="pagination-controls d-flex align-items-center gap-1">
                            <select class="form-select form-select-sm" id="maintPageSizeSelect">
                                <option value="10" selected>10条/页</option>
                                <option value="20">20条/页</option>
                                <option value="50">50条/页</option>
                            </select>
                        </div>
                    </div>
                    <div id="addError" class="text-danger small d-none mt-2"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div class="modal fade" id="delModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">确认删除</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="delModalText">确定删除该操作员？</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-danger btn-sm" id="delConfirmBtn">删除</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap@5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="../vendor/flatpickr@4.6.13/js/flatpickr.min.js"></script>
    <script src="../vendor/flatpickr@4.6.13/l10n/zh.js"></script>
    <script src="../vendor/xlsx@0.18.5/xlsx.full.min.js"></script>
    <script src="../api-config.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script src="js/month-range-picker.js"></script>
    <script>
        (function() {
            const toggle = document.getElementById('mockToggle');
            const status = document.getElementById('mockStatus');
            if (toggle && status) {
                toggle.checked = API_CONFIG.useMock;
                status.textContent = API_CONFIG.useMock ? 'Mock' : '接口';
                status.classList.toggle('off', !API_CONFIG.useMock);
                toggle.addEventListener('change', function() {
                    setMockMode(this.checked);
                    status.textContent = this.checked ? 'Mock' : '接口';
                    status.classList.toggle('off', !this.checked);
                    location.reload();
                });
            }
        })();
    </script>
    <script src="js/cash-prehosp-trans-app.js"></script>
</body>
</html>
