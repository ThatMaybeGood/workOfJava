<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>预测门诊量报表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-2">
        <div class="page-title">
            <span class="title-bar"></span>
            预测门诊量报表
            <label class="mock-toggle">
                <span class="mock-label">Mock数据</span>
                <input type="checkbox" id="mockToggle" checked>
                <span class="mock-status" id="mockStatus">Mock</span>
            </label>
        </div>

        <div class="filter-section">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">科室名称：</span>
                    <select class="form-select form-select-sm dept-select" id="deptSelect">
                        <option value="">全部</option>
                        <option value="心血管内科">心血管内科</option>
                        <option value="呼吸科">呼吸科</option>
                        <option value="消化科">消化科</option>
                        <option value="神经内科">神经内科</option>
                        <option value="肾内科">肾内科</option>
                        <option value="骨科">骨科</option>
                        <option value="泌尿外科">泌尿外科</option>
                        <option value="神经外科">神经外科</option>
                        <option value="心脏血管外科">心脏血管外科</option>
                        <option value="肝胆胰外科">肝胆胰外科</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row g-3 stats-row mb-3">
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon blue"><i class="bi bi-bar-chart-fill"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-blue" id="tomorrowCount">462</div>
                            <div class="stat-label">预测明日门诊量</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon blue"><i class="bi bi-bar-chart-fill"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-blue" id="nextWeekCount">462</div>
                            <div class="stat-label">预测未来一周门诊量</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon blue"><i class="bi bi-bar-chart-fill"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-blue" id="nextMonthCount">462</div>
                            <div class="stat-label">预测未来一个月门诊量</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon blue"><i class="bi bi-bar-chart-fill"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-blue" id="nextYearCount">462</div>
                            <div class="stat-label">预测未来一年门诊量</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12">
                <div class="chart-card">
                    <div id="monthForecastChart" style="width: 100%; height: 350px;"></div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-12">
                <div class="chart-card">
                    <div id="yearForecastChart" style="width: 100%; height: 350px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="../api-config.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script>
        (function() {
            const toggle = document.getElementById('mockToggle');
            const status = document.getElementById('mockStatus');
            if (toggle && status) {
                toggle.checked = API_CONFIG.useMock;
                status.textContent = API_CONFIG.useMock ? 'Mock' : '接口';
                status.classList.toggle('off', !API_CONFIG.useMock);
                toggle.addEventListener('change', function() {
                    setMockMode(this.checked);
                    status.textContent = this.checked ? 'Mock' : '接口';
                    status.classList.toggle('off', !this.checked);
                    location.reload();
                });
            }
        })();
    </script>
    <script src="js/forecast-app.js"></script>
</body>
</html>
