<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>患者画像</title>
    <link href="../vendor/bootstrap@5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../vendor/flatpickr@4.6.13/css/flatpickr.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-2">
        <div class="page-title">
            <span class="title-bar"></span>
            患者画像
            <label class="mock-toggle">
                <span class="mock-label">Mock数据</span>
                <input type="checkbox" id="mockToggle" checked>
                <span class="mock-status" id="mockStatus">Mock</span>
            </label>
        </div>

        <div class="filter-section">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <div class="patient-type-tabs">
                    <button class="patient-type-tab active" data-type="outpatient">门诊患者</button>
                    <button class="patient-type-tab" data-type="inpatient">住院患者</button>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">统计时间：</span>
                    <div class="filter-buttons" id="timeFilter">
                        <button class="filter-btn" data-value="lastMonth">近一月</button>
                        <button class="filter-btn" data-value="lastWeek">近一周</button>
                        <button class="filter-btn" data-value="yesterday">昨日</button>
                        <button class="filter-btn active" data-value="today">今日</button>
                    </div>
                    <div class="date-range-picker">
                        <div class="date-input-wrapper range-wrapper">
                            <input type="text" class="form-control form-control-sm date-input" id="dateRange" value="2025/09/22 ~ 2025/10/22" readonly>
                            <i class="bi bi-calendar date-input-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">科室名称：</span>
                    <select class="form-select form-select-sm dept-select" id="deptSelect">
                        <option value="">全部</option>
                        <option value="心血管内科">心血管内科</option>
                        <option value="呼吸科">呼吸科</option>
                        <option value="消化科">消化科</option>
                        <option value="神经内科">神经内科</option>
                        <option value="肾内科">肾内科</option>
                        <option value="骨科">骨科</option>
                        <option value="泌尿外科">泌尿外科</option>
                        <option value="神经外科">神经外科</option>
                        <option value="心脏血管外科">心脏血管外科</option>
                        <option value="肝胆胰外科">肝胆胰外科</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-12">
                <div class="chart-card">
                    <div class="chart-card-title">患者年龄区间分析</div>
                    <div id="ageChart" class="age-chart-container"></div>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <div class="chart-card">
                    <div id="insuranceChart" class="chart-container"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-card">
                    <div id="identityChart" class="chart-container"></div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="chart-card">
                    <div id="registerOriginChart" class="chart-container"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="chart-card">
                    <div id="archiveOriginChart" class="chart-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap@5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="../vendor/flatpickr@4.6.13/js/flatpickr.min.js"></script>
    <script src="../vendor/flatpickr@4.6.13/l10n/zh.js"></script>
    <script src="../vendor/echarts@5.4.3/echarts.min.js"></script>
    <script src="../api-config.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script>
        (function() {
            const toggle = document.getElementById('mockToggle');
            const status = document.getElementById('mockStatus');
            if (toggle && status) {
                toggle.checked = API_CONFIG.useMock;
                status.textContent = API_CONFIG.useMock ? 'Mock' : '接口';
                status.classList.toggle('off', !API_CONFIG.useMock);
                toggle.addEventListener('change', function() {
                    setMockMode(this.checked);
                    status.textContent = this.checked ? 'Mock' : '接口';
                    status.classList.toggle('off', !this.checked);
                    location.reload();
                });
            }
        })();
    </script>
    <script src="js/patient-portrait-app.js"></script>
</body>
</html>
