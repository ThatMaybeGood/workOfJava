<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>门诊预警统计</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-2">
        <div class="page-title">
            <span class="title-bar"></span>
            门诊预警统计
            <label class="mock-toggle">
                <span class="mock-label">Mock数据</span>
                <input type="checkbox" id="mockToggle" checked>
                <span class="mock-status" id="mockStatus">Mock</span>
            </label>
        </div>

        <div class="filter-section">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">统计时间：</span>
                    <div class="filter-buttons" id="timeFilter">
                        <button class="filter-btn" data-value="lastMonth">近一月</button>
                        <button class="filter-btn" data-value="lastWeek">近一周</button>
                        <button class="filter-btn" data-value="yesterday">昨日</button>
                        <button class="filter-btn active" data-value="today">今日</button>
                    </div>
                    <div class="date-range-picker">
                        <div class="date-input-wrapper range-wrapper">
                            <input type="text" class="form-control form-control-sm date-input" id="dateRange" value="2025/09/22 ~ 2025/10/22" readonly>
                            <i class="bi bi-calendar date-input-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">科室名称：</span>
                    <select class="form-select form-select-sm dept-select" id="deptSelect">
                        <option value="">全部</option>
                        <option value="心血管内科">心血管内科</option>
                        <option value="呼吸科">呼吸科</option>
                        <option value="消化科">消化科</option>
                        <option value="神经内科">神经内科</option>
                        <option value="肾内科">肾内科</option>
                        <option value="骨科">骨科</option>
                        <option value="泌尿外科">泌尿外科</option>
                        <option value="神经外科">神经外科</option>
                        <option value="心脏血管外科">心脏血管外科</option>
                        <option value="肝胆胰外科">肝胆胰外科</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row g-3 stats-row mb-3">
            <div class="col-md-4">
                <div class="card stat-card lab-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon blue"><i class="bi bi-bar-chart-fill"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-blue" id="remainAlert">462</div>
                            <div class="stat-label">当日余号预警频次 <i class="bi bi-info-circle info-icon" title="余号数小于5的预警次数之和"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card lab-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon blue"><i class="bi bi-bar-chart-fill"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-blue" id="appointmentAlert">462</div>
                            <div class="stat-label">号源预约预警频次 <i class="bi bi-info-circle info-icon" title="未来三天预约率超过60%的预警次数之和"></i></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card lab-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon blue"><i class="bi bi-bar-chart-fill"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-blue" id="earlyLeave">462</div>
                            <div class="stat-label">早退统计 <i class="bi bi-info-circle info-icon" title="早上12:00之前，下午16:40之前，最后一次退出HIS工作站的时间总计"></i></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 revenue-tables-row">
            <div class="col-md-6">
                <div class="table-section">
                    <div class="table-header d-flex justify-content-between align-items-center">
                        <div class="table-title"><i class="bi bi-hospital-fill"></i>各科室门诊预警统计</div>
                        <button class="btn btn-primary btn-sm" onclick="exportDeptData()"><i class="bi bi-download me-1"></i>导出报表</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover table-bordered mb-0" id="deptTable">
                            <thead class="table-light">
                                <tr>
                                    <th>科室</th>
                                    <th class="sortable" data-column="remainAlert" data-type="number">当日余号预警频次 <i class="bi bi-sort-up"></i></th>
                                    <th class="sortable" data-column="appointmentAlert" data-type="number">号源预约预警频次 <i class="bi bi-sort-up"></i></th>
                                    <th class="sortable" data-column="earlyLeave" data-type="number">早退统计 <i class="bi bi-sort-up"></i></th>
                                </tr>
                            </thead>
                            <tbody id="deptTableBody"></tbody>
                        </table>
                    </div>
                    <div class="pagination-wrapper d-flex justify-content-center align-items-center mt-3 gap-3">
                        <div class="pagination-info"><span id="deptPageInfo">10条/页 共55条</span></div>
                        <nav aria-label="Page navigation"><ul class="pagination mb-0" id="deptPagination"></ul></nav>
                        <div class="pagination-controls d-flex align-items-center gap-1">
                            <select class="form-select form-select-sm" id="deptPageSizeSelect">
                                <option value="10" selected>10条/页</option>
                                <option value="20">20条/页</option>
                                <option value="50">50条/页</option>
                            </select>
                            <span>跳至</span>
                            <input type="number" class="form-control form-control-sm page-jump-input" id="deptJumpPage" min="1">
                            <span>页</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="jumpToDeptPage()">确定</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="table-section">
                    <div class="table-header d-flex justify-content-between align-items-center">
                        <div class="table-title"><i class="bi bi-person-workspace"></i>各科室医生门诊预警统计</div>
                        <button class="btn btn-primary btn-sm" onclick="exportDoctorData()"><i class="bi bi-download me-1"></i>导出Excel</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover table-bordered mb-0" id="doctorTable">
                            <thead class="table-light">
                                <tr>
                                    <th>医生</th>
                                    <th>科室</th>
                                    <th class="sortable" data-column="remainAlert" data-type="number">当日余号预警频次 <i class="bi bi-sort-up"></i></th>
                                    <th class="sortable" data-column="appointmentAlert" data-type="number">号源预约预警频次 <i class="bi bi-sort-up"></i></th>
                                    <th class="sortable" data-column="earlyLeave" data-type="number">早退统计 <i class="bi bi-sort-up"></i></th>
                                </tr>
                            </thead>
                            <tbody id="doctorTableBody"></tbody>
                        </table>
                    </div>
                    <div class="pagination-wrapper d-flex justify-content-center align-items-center mt-3 gap-3">
                        <div class="pagination-info"><span id="doctorPageInfo">10条/页 共55条</span></div>
                        <nav aria-label="Page navigation"><ul class="pagination mb-0" id="doctorPagination"></ul></nav>
                        <div class="pagination-controls d-flex align-items-center gap-1">
                            <select class="form-select form-select-sm" id="doctorPageSizeSelect">
                                <option value="10" selected>10条/页</option>
                                <option value="20">20条/页</option>
                                <option value="50">50条/页</option>
                            </select>
                            <span>跳至</span>
                            <input type="number" class="form-control form-control-sm page-jump-input" id="doctorJumpPage" min="1">
                            <span>页</span>
                            <button class="btn btn-sm btn-outline-secondary" onclick="jumpToDoctorPage()">确定</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/zh.js"></script>
    <script src="../../api-config.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script>
        (function() {
            const toggle = document.getElementById('mockToggle');
            const status = document.getElementById('mockStatus');
            if (toggle && status) {
                toggle.checked = API_CONFIG.useMock;
                status.textContent = API_CONFIG.useMock ? 'Mock' : '接口';
                status.classList.toggle('off', !API_CONFIG.useMock);
                toggle.addEventListener('change', function() {
                    setMockMode(this.checked);
                    status.textContent = this.checked ? 'Mock' : '接口';
                    status.classList.toggle('off', !this.checked);
                    location.reload();
                });
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/alert-app.js"></script>
</body>
</html>
