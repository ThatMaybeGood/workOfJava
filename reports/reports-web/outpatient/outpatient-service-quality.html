<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>门诊服务质量分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-2">
        <div class="page-title">
            <span class="title-bar"></span>
            门诊服务质量分析
            <label class="mock-toggle">
                <span class="mock-label">Mock数据</span>
                <input type="checkbox" id="mockToggle" checked>
                <span class="mock-status" id="mockStatus">Mock</span>
            </label>
        </div>

        <div class="filter-section">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">统计时间：</span>
                    <div class="filter-buttons" id="timeFilter">
                        <button class="filter-btn" data-value="lastMonth">近一月</button>
                        <button class="filter-btn" data-value="lastWeek">近一周</button>
                        <button class="filter-btn" data-value="yesterday">昨日</button>
                        <button class="filter-btn active" data-value="today">今日</button>
                    </div>
                    <div class="date-range-picker">
                        <div class="date-input-wrapper range-wrapper">
                            <input type="text" class="form-control form-control-sm date-input" id="dateRange" value="2025/09/22 ~ 2025/10/22" readonly>
                            <i class="bi bi-calendar date-input-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">科室名称：</span>
                    <select class="form-select form-select-sm dept-select" id="deptSelect">
                        <option value="">全部</option>
                        <option value="心血管内科">心血管内科</option>
                        <option value="呼吸科">呼吸科</option>
                        <option value="消化科">消化科</option>
                        <option value="神经内科">神经内科</option>
                        <option value="肾内科">肾内科</option>
                        <option value="骨科">骨科</option>
                        <option value="泌尿外科">泌尿外科</option>
                        <option value="神经外科">神经外科</option>
                        <option value="心脏血管外科">心脏血管外科</option>
                        <option value="肝胆胰外科">肝胆胰外科</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row g-3 stats-row mb-3">
            <div class="col-md-2">
                <div class="card stat-card lab-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon blue"><i class="bi bi-bar-chart-fill"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-blue" id="complaintCount">46</div>
                            <div class="stat-label">投诉量</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card stat-card lab-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon blue"><i class="bi bi-bar-chart-fill"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-blue" id="praiseCount">46</div>
                            <div class="stat-label">表扬量</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header d-flex justify-content-between align-items-center">
                <div class="table-title"><i class="bi bi-clipboard-data"></i><span id="tableTitleText">各科室投诉表明细</span></div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#dictModal"><i class="bi bi-book me-1"></i>字典管理</button>
                    <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal" data-bs-target="#maintainModal"><i class="bi bi-pencil-square me-1"></i>数据维护</button>
                    <button class="btn btn-primary btn-sm" onclick="exportData()"><i class="bi bi-download me-1"></i>导出Excel</button>
                </div>
            </div>

            <div class="service-tabs">
                <button class="service-tab active" data-tab="complaint">投诉明细</button>
                <button class="service-tab" data-tab="praise">表扬明细</button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover table-bordered mb-0" id="serviceQualityTable">
                    <thead class="table-light" id="tableHead">
                        <tr>
                            <th>投诉时间</th>
                            <th>被投诉科室</th>
                            <th>被投诉人员</th>
                            <th>岗位类别</th>
                            <th>投诉分类</th>
                            <th>处理结果</th>
                            <th>备注</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="pagination-wrapper d-flex justify-content-center align-items-center mt-3 gap-3">
                <div class="pagination-info"><span id="pageInfo">10条/页 共55条</span></div>
                <nav aria-label="Page navigation"><ul class="pagination mb-0" id="pagination"></ul></nav>
                <div class="pagination-controls d-flex align-items-center gap-1">
                    <select class="form-select form-select-sm" id="pageSizeSelect">
                        <option value="10" selected>10条/页</option>
                        <option value="20">20条/页</option>
                        <option value="50">50条/页</option>
                    </select>
                    <span>跳至</span>
                    <input type="number" class="form-control form-control-sm page-jump-input" id="jumpPage" min="1">
                    <span>页</span>
                    <button class="btn btn-sm btn-outline-secondary" onclick="jumpToPage()">确定</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 字典管理弹窗 -->
    <div class="modal fade" id="dictModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">字典管理</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="list-group" id="dictCategoryList">
                                <a href="#" class="list-group-item list-group-item-action active" data-category="position">岗位类别</a>
                                <a href="#" class="list-group-item list-group-item-action" data-category="complaintCategory">投诉分类</a>
                                <a href="#" class="list-group-item list-group-item-action" data-category="complaintResult">投诉处理结果</a>
                                <a href="#" class="list-group-item list-group-item-action" data-category="praiseMethod">表扬方式</a>
                                <a href="#" class="list-group-item list-group-item-action" data-category="feedback">是否反馈科室</a>
                            </div>
                        </div>
                        <div class="col-md-9">
                            <table class="table table-bordered">
                                <thead class="table-light">
                                    <tr><th>字典值</th><th>操作</th></tr>
                                </thead>
                                <tbody id="dictValueBody">
                                    <tr><td>医师</td><td><a href="#" class="text-primary">删除</a></td></tr>
                                    <tr><td>护士</td><td><a href="#" class="text-primary">删除</a></td></tr>
                                    <tr><td>技师</td><td><a href="#" class="text-primary">删除</a></td></tr>
                                    <tr><td>药师</td><td><a href="#" class="text-primary">删除</a></td></tr>
                                    <tr><td>劳务派遣</td><td><a href="#" class="text-primary">删除</a></td></tr>
                                    <tr><td>第三方购买服务</td><td><a href="#" class="text-primary">删除</a></td></tr>
                                </tbody>
                            </table>
                            <div class="mt-2">
                                <input type="text" class="form-control form-control-sm d-inline-block w-auto" placeholder="新增字典值">
                                <button class="btn btn-primary btn-sm ms-2">添加</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 数据维护弹窗 -->
    <div class="modal fade" id="maintainModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">数据维护</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <div class="filter-buttons">
                            <button class="filter-btn active">投诉</button>
                            <button class="filter-btn">表扬</button>
                        </div>
                        <div class="date-input-wrapper">
                            <input type="text" class="form-control form-control-sm date-input" value="2025-09-01" readonly>
                            <i class="bi bi-calendar date-input-icon"></i>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead class="table-light">
                                <tr>
                                    <th>被投诉科室</th>
                                    <th>被投诉人员</th>
                                    <th>岗位类别</th>
                                    <th>投诉分类</th>
                                    <th>处理结果</th>
                                    <th>备注</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td><input type="text" class="form-control form-control-sm"></td>
                                    <td><input type="text" class="form-control form-control-sm"></td>
                                    <td>
                                        <select class="form-select form-select-sm"><option></option><option>医师</option><option>护士</option></select>
                                    </td>
                                    <td>
                                        <select class="form-select form-select-sm"><option></option><option>病历问题</option><option>费用问题</option></select>
                                    </td>
                                    <td>
                                        <select class="form-select form-select-sm"><option></option><option>有效投诉</option><option>无效投诉</option></select>
                                    </td>
                                    <td><input type="text" class="form-control form-control-sm"></td>
                                    <td><a href="#" class="text-primary">添加</a> | <a href="#" class="text-danger">删除</a></td>
                                </tr>
                                <tr>
                                    <td><input type="text" class="form-control form-control-sm"></td>
                                    <td><input type="text" class="form-control form-control-sm"></td>
                                    <td>
                                        <select class="form-select form-select-sm"><option></option><option>医师</option><option>护士</option></select>
                                    </td>
                                    <td>
                                        <select class="form-select form-select-sm"><option></option><option>病历问题</option><option>费用问题</option></select>
                                    </td>
                                    <td>
                                        <select class="form-select form-select-sm"><option></option><option>有效投诉</option><option>无效投诉</option></select>
                                    </td>
                                    <td><input type="text" class="form-control form-control-sm"></td>
                                    <td><a href="#" class="text-primary">添加</a> | <a href="#" class="text-danger">删除</a></td>
                                </tr>
                                <tr>
                                    <td><input type="text" class="form-control form-control-sm"></td>
                                    <td><input type="text" class="form-control form-control-sm"></td>
                                    <td>
                                        <select class="form-select form-select-sm"><option></option><option>医师</option><option>护士</option></select>
                                    </td>
                                    <td>
                                        <select class="form-select form-select-sm"><option></option><option>病历问题</option><option>费用问题</option></select>
                                    </td>
                                    <td>
                                        <select class="form-select form-select-sm"><option></option><option>有效投诉</option><option>无效投诉</option></select>
                                    </td>
                                    <td><input type="text" class="form-control form-control-sm"></td>
                                    <td><a href="#" class="text-primary">添加</a> | <a href="#" class="text-danger">删除</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/zh.js"></script>
    <script src="../api-config.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script>
        (function() {
            const toggle = document.getElementById('mockToggle');
            const status = document.getElementById('mockStatus');
            if (toggle && status) {
                toggle.checked = API_CONFIG.useMock;
                status.textContent = API_CONFIG.useMock ? 'Mock' : '接口';
                status.classList.toggle('off', !API_CONFIG.useMock);
                toggle.addEventListener('change', function() {
                    setMockMode(this.checked);
                    status.textContent = this.checked ? 'Mock' : '接口';
                    status.classList.toggle('off', !this.checked);
                    location.reload();
                });
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="js/service-quality-app.js"></script>
</body>
</html>
