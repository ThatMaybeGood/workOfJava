<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>治疗统计报表</title>
    <link href="../vendor/bootstrap@5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../vendor/flatpickr@4.6.13/css/flatpickr.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid py-2">
        <div class="page-title">
            <span class="title-bar"></span>
            治疗统计报表
            <label class="mock-toggle">
                <span class="mock-label">Mock数据</span>
                <input type="checkbox" id="mockToggle" checked>
                <span class="mock-status" id="mockStatus">Mock</span>
            </label>
        </div>

        <div class="filter-section">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">统计时间：</span>
                    <div class="filter-buttons" id="timeFilter">
                        <button class="filter-btn" data-value="lastMonth">近一月</button>
                        <button class="filter-btn" data-value="lastWeek">近一周</button>
                        <button class="filter-btn" data-value="yesterday">昨日</button>
                        <button class="filter-btn active" data-value="today">今日</button>
                    </div>
                    <div class="date-range-picker">
                        <div class="date-input-wrapper range-wrapper">
                            <input type="text" class="form-control form-control-sm date-input" id="dateRange" readonly>
                            <i class="bi bi-calendar date-input-icon"></i>
                        </div>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">就诊类型：</span>
                    <select class="form-select form-select-sm" id="visitTypeSelect">
                        <option value="">全部</option>
                        <option value="ordinary">普通门诊</option>
                        <option value="expert">专家门诊</option>
                        <option value="special">特需门诊</option>
                    </select>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">患者来源：</span>
                    <select class="form-select form-select-sm" id="sourceSelect">
                        <option value="">全部</option>
                        <option value="window">窗口</option>
                        <option value="self">自助机</option>
                        <option value="online">线上</option>
                    </select>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="filter-label">年龄段：</span>
                    <select class="form-select form-select-sm" id="ageSelect">
                        <option value="">全部</option>
                        <option value="0-14">0-14</option>
                        <option value="15-19">15-19</option>
                        <option value="20-29">20-29</option>
                        <option value="30-39">30-39</option>
                        <option value="40-49">40-49</option>
                        <option value="50-59">50-59</option>
                        <option value="60-69">60-69</option>
                        <option value="70-79">70-79</option>
                        <option value="80-89">80-89</option>
                        <option value="90+">90+</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="row g-3 stats-row mb-3">
            <div class="col-md-3">
                <div class="card stat-card lab-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon blue"><i class="bi bi-people-fill"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-blue" id="patientCount">0</div>
                            <div class="stat-label">治疗患者数</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card lab-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon cyan"><i class="bi bi-activity"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-cyan" id="treatmentCount">0</div>
                            <div class="stat-label">治疗人次</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card lab-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon purple"><i class="bi bi-currency-yen"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-purple" id="treatmentAmount">0</div>
                            <div class="stat-label">治疗金额</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card lab-card">
                    <div class="card-body d-flex align-items-center">
                        <div class="stat-icon green"><i class="bi bi-graph-up"></i></div>
                        <div class="ms-3">
                            <div class="stat-value text-green" id="avgAmount">0</div>
                            <div class="stat-label">平均金额</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-7">
                <div class="chart-section">
                    <div class="chart-title"><i class="bi bi-graph-up"></i>治疗量趋势</div>
                    <div id="trendChart" class="chart-container" style="height:320px"></div>
                </div>
            </div>
            <div class="col-md-5">
                <div class="chart-section">
                    <div class="chart-title"><i class="bi bi-bar-chart-fill"></i>TOP10 治疗项目</div>
                    <div id="topProjectsChart" class="chart-container" style="height:320px"></div>
                </div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header d-flex justify-content-between align-items-center">
                <div class="table-title"><i class="bi bi-hospital-fill"></i>各科室治疗情况分析</div>
                <button class="btn btn-primary btn-sm" onclick="exportData()"><i class="bi bi-download me-1"></i>导出Excel</button>
            </div>
            <div class="table-responsive">
                <table class="table table-hover table-bordered mb-0" id="treatmentTable">
                    <thead class="table-light">
                        <tr>
                            <th>排名</th>
                            <th>科室</th>
                            <th class="sortable" data-column="patientCount" data-type="number">患者人数 <i class="bi bi-sort-up"></i></th>
                            <th class="sortable" data-column="treatmentCount" data-type="number">治疗人次 <i class="bi bi-sort-up"></i></th>
                            <th class="sortable" data-column="treatmentAmount" data-type="number">治疗金额 <i class="bi bi-sort-up"></i></th>
                            <th class="sortable" data-column="avgAmount" data-type="number">平均金额 <i class="bi bi-sort-up"></i></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>

            <div class="pagination-wrapper d-flex justify-content-center align-items-center mt-3 gap-3">
                <div class="pagination-info"><span id="pageInfo">10条/页 共0条</span></div>
                <nav aria-label="Page navigation"><ul class="pagination mb-0" id="pagination"></ul></nav>
                <div class="pagination-controls d-flex align-items-center gap-1">
                    <select class="form-select form-select-sm" id="pageSizeSelect">
                        <option value="10" selected>10条/页</option>
                        <option value="20">20条/页</option>
                        <option value="50">50条/页</option>
                    </select>
                    <span>跳至</span>
                    <input type="number" class="form-control form-control-sm page-jump-input" id="jumpPage" min="1">
                    <span>页</span>
                    <button class="btn btn-sm btn-outline-secondary" onclick="treatmentStatsController.jumpToPage()">确定</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap@5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="../vendor/flatpickr@4.6.13/js/flatpickr.min.js"></script>
    <script src="../vendor/flatpickr@4.6.13/l10n/zh.js"></script>
    <script src="../api-config.js"></script>
    <script src="js/mock.js"></script>
    <script src="js/api.js"></script>
    <script>
        (function() {
            const toggle = document.getElementById('mockToggle');
            const status = document.getElementById('mockStatus');
            if (toggle && status) {
                toggle.checked = API_CONFIG.useMock;
                status.textContent = API_CONFIG.useMock ? 'Mock' : '接口';
                status.classList.toggle('off', !API_CONFIG.useMock);
                toggle.addEventListener('change', function() {
                    setMockMode(this.checked);
                    status.textContent = this.checked ? 'Mock' : '接口';
                    status.classList.toggle('off', !this.checked);
                    location.reload();
                });
            }
        })();
    </script>
    <script src="../vendor/echarts@5.4.3/echarts.min.js"></script>
    <script src="../vendor/xlsx@0.18.5/xlsx.full.min.js"></script>
    <script src="js/treatment-stats-app.js"></script>
</body>
</html>
