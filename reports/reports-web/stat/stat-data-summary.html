<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运营数据统计</title>
    <link href="../vendor/bootstrap@5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../vendor/flatpickr@4.6.13/css/flatpickr.min.css" rel="stylesheet">
    <link href="../cash/css/style.css" rel="stylesheet">
    <link href="../cash/css/month-range-picker.css" rel="stylesheet">
    <style>
        /* 13个页签两行紧凑排布 */
        #tabFilter { flex-wrap: wrap; row-gap: 6px; }
        #tabFilter .service-tab { padding: 5px 10px; font-size: 12.5px; white-space: nowrap; }
        .stat-value .stat-unit { font-size: 12px; font-weight: 400; }
    </style>
</head>
<body>
    <div class="container-fluid py-2">
        <div class="page-title d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center">
                <span class="title-bar"></span>
                运营数据统计
            </div>
            <div class="d-flex align-items-center gap-2">
                <label class="mock-toggle mb-0">
                    <span class="mock-label">Mock数据</span>
                    <input type="checkbox" id="mockToggle" checked>
                    <span class="mock-status" id="mockStatus">Mock</span>
                </label>
                <button class="btn btn-primary btn-sm" id="exportBtn">
                    <i class="bi bi-download me-1"></i>导出Excel
                </button>
            </div>
        </div>

        <div class="filter-section">
            <div class="d-flex align-items-center gap-2 flex-wrap" id="timeGroup">
                <span class="filter-label">统计日期：</span>
                <div class="filter-buttons" id="timeDimensionFilter">
                    <button class="filter-btn" data-value="month">按月统计</button>
                    <button class="filter-btn" data-value="day">按天统计</button>
                </div>
                <div class="date-range-picker">
                    <div class="date-input-wrapper range-wrapper" id="dayRangeWrapper">
                        <input type="text" class="form-control form-control-sm date-input" id="dateRange" readonly>
                        <i class="bi bi-calendar date-input-icon"></i>
                    </div>
                    <span id="monthRangePicker" style="display:none;"></span>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2 mt-2 flex-wrap">
                <div class="service-tabs" id="tabFilter"></div>
            </div>
        </div>

        <div id="cardsSection" class="row g-3 stats-row mb-3" style="display:none;"></div>

        <div class="row mb-3">
            <div class="col-12">
                <div class="table-section">
                    <div class="table-responsive">
                        <table class="table table-hover table-bordered mb-0" id="statTable">
                            <thead class="table-light" id="statTableHead"></thead>
                            <tbody id="statTableBody"></tbody>
                        </table>
                    </div>
                    <div class="pagination-wrapper d-flex justify-content-center align-items-center mt-3 gap-3" id="pagerWrapper" style="display:none;">
                        <div class="pagination-info"><span id="pageInfo"></span></div>
                        <nav aria-label="Page navigation"><ul class="pagination mb-0" id="pagination"></ul></nav>
                        <div class="pagination-controls d-flex align-items-center gap-1">
                            <select class="form-select form-select-sm" id="pageSizeSelect">
                                <option value="10" selected>10条/页</option>
                                <option value="20">20条/页</option>
                                <option value="50">50条/页</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../vendor/bootstrap@5.3.2/js/bootstrap.bundle.min.js"></script>
    <script src="../vendor/flatpickr@4.6.13/js/flatpickr.min.js"></script>
    <script src="../vendor/flatpickr@4.6.13/l10n/zh.js"></script>
    <script src="../vendor/xlsx@0.18.5/xlsx.full.min.js"></script>
    <script src="../api-config.js"></script>
    <script src="../cash/js/month-range-picker.js"></script>
    <script>
        (function() {
            const toggle = document.getElementById('mockToggle');
            const status = document.getElementById('mockStatus');
            if (toggle && status) {
                toggle.checked = API_CONFIG.useMock;
                status.textContent = API_CONFIG.useMock ? 'Mock' : '接口';
                status.classList.toggle('off', !API_CONFIG.useMock);
                toggle.addEventListener('change', function() {
                    setMockMode(this.checked);
                    status.textContent = this.checked ? 'Mock' : '接口';
                    status.classList.toggle('off', !this.checked);
                    location.reload();
                });
            }
        })();
    </script>
    <script src="js/stat-data-summary-app.js"></script>
</body>
</html>
