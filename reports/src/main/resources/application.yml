server:
  port: 18089
  servlet:
    context-path: /

spring:
  application:
    name: reports-gateway
  profiles:
    active: dev

# 追踪号配置
reports:
  trace:
    # 追踪号前缀规则: 字母组合+数字, 如 YQ, WM
    prefix: "YQ"
    # 追踪号数字长度
    number-length: 9
    # 是否包含方括号
    include-brackets: false
  data:
    # 数据模式: mock(默认) / jdbc / mybatis-plus
    mode: mock
  # 分页默认配置
  page:
    # 默认当前页码
    default-page: 1
    # 默认每页条数
    default-page-size: 10

# 日志配置
logging:
  level:
    com.reports: TRACE
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - [%X{traceId}] [%X{seq}] %msg%n"
