server:
  port: 18089
  servlet:
    context-path: /

spring:
  application:
    name: reports-gateway
  profiles:
    active: dev

# 追踪号配置
reports:
  trace:
    # 追踪号前缀规则: 字母组合+数字, 如 YQ, WM
    prefix: "YQ"
    # 追踪号数字长度
    number-length: 9
    # 是否包含方括号
    include-brackets: false
  data:
    # 数据模式: mock(默认) / jdbc / mybatis-plus
    mode: mybatis-plus
  # ===== ETL 按需补数触发（新增独立功能，不挂 @EtlTask 注解即零影响） =====
  etl:
    # 总开关：false = 整个 ETL 触发关闭（出问题可一键停用，报表不受影响）
    enabled: true
    # ETL 平台 run 接口地址（真实值建议按环境用环境变量注入）
    run-url: ${ETL_RUN_URL:http://localhost:18090/api/etl/run}
    # 鉴权令牌（内网环境直接配置）
    api-token: ${ETL_API_TOKEN:0cb06f7a29064e62a5de34d484296456}
    # 同一 (任务+参数) 两次触发的最小间隔（秒）：防空表被反复刷新导致的重复触发
    cooldown-seconds: 600
    # 单任务停用名单：填真实 taskToken 即停用该任务（只停某一个，其余保留，无需动注解）
    disabled-task-tokens: []
  # 分页默认配置
  page:
    # 默认当前页码
    default-page: 1
    # 默认每页条数
    default-page-size: 10

# 日志配置
logging:
  level:
    com.reports: INFO
    com.reports.mapper: DEBUG

    # MyBatis
    org.apache.ibatis: INFO        # ✅ 不输出列信息
    org.mybatis: INFO

    # Spring
    org.springframework: INFO
    org.springframework.web: INFO

    # 根日志
    root: INFO

  # ===== 日志留存策略（由 logback-spring.xml 读取；改留存只动这里，不动 XML） =====
  logback:
    # 日志目录：相对启动目录；生产建议绝对路径（如 /data/logs/reports）
    path: logs
    # 主日志（reports.log）保留天数
    max-history: 30
    # 错误日志（reports-error.log）保留天数
    error-max-history: 90
    # SQL 日志（reports-sql.log）保留天数
    sql-max-history: 7
    # 单个日志文件上限，超出当天按序号切新文件
    max-file-size: 100MB
    # 滚动总量上限：按每个滚动策略独立计算（主/错误/SQL 各一份），超限自动删最旧文件
    total-size-cap: 2GB

# MyBatis 日志
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
