# ============================================================
# 测试环境配置
#
# 指向专门的测试库（不是生产库），表结构与测试数据由
# com.reports.tools.ReportDbInitializer 从 docs/ddl/*.sql 建出并灌入，
# 可随时重跑重建。
#
# 启动方式（application.yml 里 spring.profiles.active 已切到 test）：
#   mvn -o spring-boot:run
# 需要临时换回其它库时用环境变量覆盖，不必改本文件：
#   SPRING_DATASOURCE_MASTER_URL=... mvn -o spring-boot:run
# ============================================================

spring:
  datasource:
    # 主数据源（默认）—— 测试库
    master:
      driver-class-name: oracle.jdbc.OracleDriver
      url: jdbc:oracle:thin:@192.168.31.35:1521:orcl
      username: mine
      password: Pass1230
      # Druid连接池配置
      type: com.alibaba.druid.pool.DruidDataSource
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
