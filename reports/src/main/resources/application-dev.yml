spring:
  datasource:
    # 主数据源（默认）
    master:
      driver-class-name: oracle.jdbc.OracleDriver
      # CONNECT_TIMEOUT：建连超时(毫秒)。不设的话库不可达时 Oracle 会长时间重试，
      # 请求一直不返回，前端只能干等（页面/弹层一直转圈）
      url: jdbc:oracle:thin:@//168.168.235.105:1521/yuanqi?oracle.net.CONNECT_TIMEOUT=5000
      username: powerihsp
      password: yuanqi
      # Druid连接池配置
      type: com.alibaba.druid.pool.DruidDataSource
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 5000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
    
    # HIS 业务库（出院结算人次统计等直查 HIS 的报表使用，@DataSource("his") 切换）
